{{- $id := .Get "id" | default (printf "vega-%d" .Ordinal) -}}
{{- $file := .Get "file" -}}
{{- $resource := .Page.Resources.GetMatch $file -}}
{{- if not $resource -}}
  {{- errorf "vega shortcode: resource %q not found in page bundle" $file -}}
{{- end -}}
<div id="{{ $id }}" class="vega-chart" style="width: 100%; margin: 1.5rem 0;"></div>
<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
<script>
  vegaEmbed(
    "#{{ $id }}",
    {{ $resource.Content | safeJS }},
    {
      actions: { export: true, source: false, editor: false },
      renderer: "svg",
    }
  );
</script>
