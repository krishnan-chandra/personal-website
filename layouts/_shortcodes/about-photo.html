{{ $alt := .Get "alt" | default "Portrait of Krishnan Chandra" }}
{{ $image := resources.Get "img/headshot.jpg" }}
{{ with $image }}
{{ $1x := $image.Fill "320x320 center webp q85" }}
{{ $2x := $image.Fill "640x640 center webp q85" }}
<figure class="about-photo">
  <img
    src="{{ $1x.RelPermalink }}"
    srcset="{{ $2x.RelPermalink }} 2x"
    alt="{{ $alt }}"
    width="{{ $1x.Width }}"
    height="{{ $1x.Height }}"
    loading="lazy"
    decoding="async" />
</figure>
{{ end }}
